<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JMR Player Stats</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      padding: 30px;
      margin: 0;
    }

    .wrap {
      max-width: 1100px;
      margin: auto;
      background: white;
      padding: 24px;
      border-radius: 14px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.08);
    }

    h1 {
      margin-top: 0;
    }

    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
    }

    button:hover {
      background: #1d4ed8;
    }

    #status {
      margin-top: 15px;
      color: #444;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
      display: none;
    }

    th, td {
      padding: 12px;
      border-bottom: 1px solid #ddd;
      text-align: left;
    }

    th {
      background: #111827;
      color: white;
    }

    tr:hover {
      background: #f9fafb;
    }

    .small {
      color: #666;
      font-size: 14px;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>JMR Player Stats</h1>
    <button onclick="loadPlayers()">Load Data</button>
    <p id="status">Button dabao data load karne ke liye.</p>
    <p class="small">Data source: varq.net</p>

    <table id="playersTable">
      <thead>
        <tr>
          <th>Rank</th>
          <th>Name</th>
          <th>Last Seen</th>
          <th>Score</th>
          <th>Play Time</th>
          <th>Score/Hour</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <script>
    async function loadPlayers() {
      const status = document.getElementById("status");
      const table = document.getElementById("playersTable");
      const tbody = table.querySelector("tbody");

      status.textContent = "Loading data...";
      table.style.display = "none";
      tbody.innerHTML = "";

      try {
        const res = await fetch("/api/players");
        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.error || "Request failed");
        }

        if (!Array.isArray(data)) {
          throw new Error("Invalid response format");
        }

        data.forEach(player => {
          const row = document.createElement("tr");
          row.innerHTML = `
            <td>${player.rank}</td>
            <td>${player.name}</td>
            <td>${player.lastSeen}</td>
            <td>${player.score}</td>
            <td>${player.playTime}</td>
            <td>${player.scorePerHour}</td>
          `;
          tbody.appendChild(row);
        });

        table.style.display = "table";
        status.textContent = `${data.length} players load ho gaye.`;
      } catch (err) {
        status.textContent = `Error: ${err.message}`;
      }
    }
  </script>
</body>
</html>
